server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文本资源 gzip 压缩
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 前端 SPA 路由：找不到静态文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 误访问 /home 或 /home/（后端 API 根路径）时跳回首页，避免显示 JSON 报错
    location = /home { return 301 /; }
    location = /home/ { return 301 /; }

    # 后端 API 反向代理（同源，消除 CORS）
    # proxy_pass 不带 URI 部分 -> 原样透传 /home/... 到后端
    location /home/ {
        proxy_pass http://backend:8360;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台 API 反向代理（前端 /admin 页面走 SPA，/admin/api 走后端）
    location /admin/api/ {
        proxy_pass http://backend:8360;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 容器健康检查端点（不依赖后端）
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
